
<div class="card flex justify-content-center align-items-center">
  <p-card
    [header]="isViewMode ? 'View Workflow' : (isEditMode ? 'Edit Workflow' : 'Create Workflow')"
    class="azure-card"
    [style]="{ width: '55vw', margin: 'auto' }"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="workflow-form">
      <div class="field-group">
        <label for="name">Workflow Name*</label>
        <input
        placeholder="Workflow Name"
          pInputText
          id="name"
          type="text"
          [ngClass]="(form.get('name')?.invalid && form.get('name')?.touched)?'ng-invalid ng-dirty':''"
          formControlName="name"
        />
        <div class="error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          *Name is required (min 3 chars).
        </div>
      </div>

      <div class="checkbox-group">
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isDrugToDrug"
            value="true"
            id="isDrugToDrug"
          />
          Diagnosis → Diagnosis</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isMedicsToMedics"
            value="true"
            id="isMedicsToMedics"
          />
          Activity → Activity</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isDrugToDiagnosis"
            value="true"
            id="isDrugToDiagnosis"
          />
          Activity → Diagnosis</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isDrugOverDose"
            value="true"
            id="isDrugOverDose"
          />
          Drug Overdose</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isHaveQuantity"
            value="true"
            id="isHaveQuantity"
          />
          Activity Quantity Restriction</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isPatientGenderActivities"
            value="true"
            id="isPatientGenderActivities"
          />
          Activity w/ Gender</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isPatientGenderDiagnosis"
            value="true"
            id="isPatientGenderDiagnosis"
          />
          Diagnosis w/ Gender</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isPatientAgeActivities"
            value="true"
            id="isPatientAgeActivities"
          />
          Activity w/ Age</label
        >
        <label
          ><p-checkbox
            [binary]="true"
            formControlName="isPatientAgeDiagnosis"
            value="true"
            id="isPatientAgeDiagnosis"
          />
          Diagnosis w/ Age</label
        >
          <label
          ><p-checkbox
            [binary]="true"
            formControlName="isDrugWithSpecificDiagnosis"
            value="true"
            id="isDrugWithSpecificDiagnosis"
          />
          Drug / Specific Diagnosis</label
        >
          <label
          ><p-checkbox
            [binary]="true"
            formControlName="isActivityWithSpecificActivity"
            value="true"
            id="isActivityWithSpecificActivity"
          />
          Activity /Specific Activity</label
        >
          <label
          ><p-checkbox
            [binary]="true"
            formControlName="isDiagnosisWithSpecificDiagnosis"
            value="true"
            id="isDiagnosisWithSpecificDiagnosis"
          />
          Diagnosis / Specific Diagnosis</label
        >
        <label
  ><p-checkbox
    [binary]="true"
    formControlName="isActivityQuantityByAgeRange"
    value="true"
    id="isActivityQuantityByAgeRange"
  />
  Activity Quantity by Patient Age Range</label>
      </div>

     

      <button [disabled]="form.invalid" type="submit" class="btn save" *ngIf="!isViewMode">
        <i class="pi pi-save me-1"></i>Save
      </button>
    </form>
  </p-card>
</div>
