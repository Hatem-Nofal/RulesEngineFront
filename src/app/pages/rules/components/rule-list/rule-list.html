<div class="workflow-container pb-3">
  <div class="card">
    <div class="d-flex w-100 justify-content-between mb-2">
      <h2 class="page-title">Rules</h2>
      <div>
        <p-button
          *abpPermission="rulesPermissions.Rules_Create"
          routerLink="/medical-rules/rules/create"
          icon="bi bi-plus"
          label="Create Rule"
          variant="outlined"
          severity="primary"
        />
        <p-button
          *abpPermission="rulesPermissions.Rules_CreateBulk"
          class="ms-2"
          routerLink="/medical-rules/rules/bulk"
          icon="bi bi-plus "
          label="Create Bulk Rules"
          variant="outlined"
          severity="primary"
        />
      </div>
    </div>
    <div class="filters-bar">
  <div class="filter-item">
    <label class="filter-label">Workflow</label>

    <p-select
      [options]="workflows"
      optionLabel="workflowName"
      optionValue="id"
      placeholder="All Workflows"
      class="w-100"
      [filter]="true"
      (onFilter)="onWorkflowFilter($event)"
      [(ngModel)]="workFlowId"
      (onChange)="onFiltersChange()"
    ></p-select>
  </div>

  <div class="filter-item">
    <label class="filter-label">Rule Name</label>

    <span class="p-input-icon-left w-100">
      <input
        pInputText
        class="w-100"
        type="text"
        [(ngModel)]="ruleName"
        placeholder="Search by rule name..."
        (keyup.enter)="onFiltersChange()"
      />
    </span>
  </div>

  <div class="filter-actions">
    <p-button
      label="Search"
      icon="pi pi-search"
      severity="primary"
      (click)="onFiltersChange()"
    ></p-button>

    <p-button
      class="ms-2"
      label="Clear"
      icon="pi pi-times"
      severity="secondary"
      variant="outlined"
      (click)="clearFilters()"
    ></p-button>
  </div>
</div>

    <p-table
      #dataTable
      styleClass=" p-datatable-striped"
      [value]="primengTableHelper.records"
      [paginator]="false"
      rows="{{ primengTableHelper.defaultRecordsCountPerPage }}"
      [lazy]="true"
      [rowHover]="true"
      ScrollWidth="100%"
      [resizableColumns]="primengTableHelper.resizableColumns"
      dataKey="name"
      groupRowsBy="id"
      (onLazyLoad)="getRules($event)"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Rule Name</th>
          <th>Workflow Name</th>
          <th>Enabled</th>
          <th>Error Message</th>
          <th>Error Type</th>
          <th
            *ngIf="permission.getGrantedPolicy(rulesPermissions.Rules_Edit) || permission.getGrantedPolicy(rulesPermissions.Rules_Delete)"
          >
            Actions
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-rule>
        <tr>
          <td>{{ rule.ruleName }}</td>
          <td>{{ rule.workflowName }}</td>
          <td>
            <span class="status-label" [ngClass]="rule.enabled ? 'enabled' : 'disabled'">
              {{ rule.enabled ? 'Enabled' : 'Disabled' }}
            </span>
          </td>
          <td>{{ rule.errorMessage }}</td>
          <td class="text-center">
            <span
              [ngClass]="{ 'flag-error': rule.errorType.toLowerCase() === 'error', 'flag-warning': rule.errorType.toLowerCase() === 'warning', 'flag-validation': rule.errorType.toLowerCase() === 'validation' }"
            >
              {{ rule.errorType }}
            </span>
          </td>
          <td
            *ngIf="permission.getGrantedPolicy(rulesPermissions.Rules_Edit) || permission.getGrantedPolicy(rulesPermissions.Rules_Delete)"
          >
            <div class="button-group">
              <p-button
                *abpPermission="rulesPermissions.Rules_Edit"
                class="action-button"
                [routerLink]="['/medical-rules/rules/edit', rule.id]"
                icon="pi pi-pen-to-square"
                [rounded]="true"
                [text]="true"
                [raised]="true"
                severity="primary"
              />
              <p-button
                *abpPermission="rulesPermissions.Rules_Delete"
                class="action-button warning"
                (click)="deleteRule(rule)"
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                [raised]="true"
                severity="danger"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
    <div>
      <p-paginator
        class="mx-2"
        [rows]="primengTableHelper.defaultRecordsCountPerPage"
        #paginator
        (onPageChange)="getRecordsIfNeeds($event)"
        [totalRecords]="primengTableHelper.totalRecordsCount"
        [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
        [showCurrentPageReport]="true"
        [currentPageReportTemplate]="'Total Records : ' + primengTableHelper.totalRecordsCount"
      ></p-paginator>
    </div>
  </div>
</div>
