<div class="card">
  <div class="card-body">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">{{ 'RuleApplication::Families:Title' | abpLocalization }}</h5>
      <button class="btn btn-primary" (click)="addNew()">
        {{ 'RuleApplication::Families:AddFamily' | abpLocalization }}
      </button>
    </div>

    <div class="border rounded p-3 mb-3">
      <div class="row g-3 align-items-end">

        <div class="col-12 col-md-4">
          <label class="form-label">{{ 'RuleApplication::Beneficiaries:Name' | abpLocalization }}</label>
          <input
            class="form-control"
            type="text"
            [(ngModel)]="search.name"
            [placeholder]="'RuleApplication::Families:SearchByName' | abpLocalization" />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">{{ 'RuleApplication::Families:FamilyId' | abpLocalization }}</label>
          <input
            class="form-control"
            type="text"
            [(ngModel)]="search.familyId"
            [placeholder]="'RuleApplication::Families:SearchByFamilyId' | abpLocalization" />
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label">{{ 'RuleApplication::Families:HofNationalId' | abpLocalization }}</label>
          <input
            class="form-control"
            type="text"
            [(ngModel)]="search.nationalId"
            [placeholder]="'RuleApplication::Families:SearchByNationalId' | abpLocalization" />
        </div>

        <div class="col-12 d-flex gap-2 justify-content-end">
          <button class="btn btn-outline-secondary" type="button" (click)="clearSearch()">
            {{ 'RuleApplication::Common:Clear' | abpLocalization }}
          </button>
          <button class="btn btn-primary" type="button" (click)="applySearch()">
            {{ 'RuleApplication::Common:Search' | abpLocalization }}
          </button>
        </div>

      </div>
    </div>

    <app-shared-table
      [columns]="columns"
      [data]="data"
      [config]="config"
      [paginationInfo]="paginationInfo"
      [actions]="actionsConfig"
      [_externalFilter]="externalFilter"
      (getPaginatedData)="onGetPaginatedData($event)"
      (deleteItem)="onDelete($event)"
      (editItem)="onEdit($event)">
    </app-shared-table>

    <p-dialog
      [header]="'RuleApplication::Families:DeleteFamily' | abpLocalization"
      [(visible)]="displayDeleteDialog"
      [modal]="true"
      [closable]="true"
      [style]="{ width: '28rem' }"
      (onHide)="closeDeleteDialog()">

      <div>
        <p class="mb-3">
          {{ 'RuleApplication::Families:DeleteConfirmation' | abpLocalization }}
        </p>

        <div class="d-flex justify-content-end gap-2 mt-3">
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="closeDeleteDialog()">
            {{ 'RuleApplication::Common:Cancel' | abpLocalization }}
          </button>

          <button
            type="button"
            class="btn btn-danger"
            (click)="confirmDelete()"
            [disabled]="deleting">
            {{ deleting 
              ? ('RuleApplication::Common:Deleting' | abpLocalization) 
              : ('RuleApplication::Common:ConfirmDelete' | abpLocalization) 
            }}
          </button>
        </div>
      </div>
    </p-dialog>

  </div>
</div>
