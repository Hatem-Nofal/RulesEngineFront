<div class="card pt-0">
    <div class="card-header d-flex align-items-center justify-content-between flex-wrap">
      <h3 class="p-0 mb-0">
        <i class="bi bi-file-earmark-medical  me-1"></i>
        ECM Claims
      </h3>
      <div class="header-filter d-flex align-items-center gap-2">
        <div class="header-filter">
          <button
            class="btn btn-primary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseExample"
            aria-expanded="true"
            aria-controls="collapseExample"
          >
            <i class="bi bi-funnel me-1"></i>
            Filter
          </button>
        </div>
      </div>
    </div>
    <div class="collapse show" id="collapseExample">
      <div
        class="card card-body pb-0 pt-1 px-4 mb-0"
        style="background-color: rgba(245, 245, 245, 0.653)"
      >
        <app-form-page
          [dynamicControls]="dynamicControls"
          (formSubmit)="handleFormSubmit($event)"
        ></app-form-page>
      </div>
    </div>
    <div class="card-body p-0 pt-2">
      <app-shared-table
        [columns]="columns"
        [data]="claimsList"
        [config]="tableConfig"
        (getPaginatedData)="getPaginatedData($event)"
         [paginationInfo]="paginationInfo" 
        [actions]="actions"
        [_externalFilter]="_externalFilter" 
      >
      </app-shared-table>
    </div>
  </div>
