
<div class="container">
  <div class="d-flex gap-2">

    <div class="card shadow-sm p-2 col-6">
      <h5> <i class="bi bi-pie-chart me-1"></i> Batch Chart</h5>
      <p-chart type="pie" [data]="batchesChart?.data" [options]="batchesChart?.options" class="w-full md:w-[30rem]" />
    </div>
    <div class="card shadow-sm p-2 col-6">
      <h5>
        <i class="bi bi-pie-chart me-1"></i> Claims Chart</h5>
      <p-chart type="pie" [data]="claimsChart?.data" [options]="claimsChart?.options" class="w-full md:w-[30rem]" />
    </div>
  </div>
  <div class="">
    <div class="card shadow-sm p-2 col-12">
      <h5> <i class="bi bi-clipboard2-data me-1"></i> No. of Claims Chart</h5>
      <p-chart type="line" id="chartLine" [data]="lineChart?.data" [options]="lineChart?.options"/>
    </div>
  </div>
</div>
