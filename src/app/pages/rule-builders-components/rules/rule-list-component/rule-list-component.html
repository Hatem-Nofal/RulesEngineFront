<main class="rule-builder-page">
  <section class="rule-builder-card">
    <header class="rule-builder-card__header">
      <h1 class="rule-builder-card__title">Rules</h1>
      <a pButton routerLink="/rules/new" icon="pi pi-plus" label="Create rule"></a>
    </header>

    <div class="rule-builder-card__body">
      <p-table
        [value]="rules()"
        [lazy]="true"
        [paginator]="true"
        [rows]="rows"
        [first]="first()"
        [totalRecords]="totalRecords()"
        [loading]="loading()"
        [rowHover]="true"
        [stripedRows]="true"
        (onLazyLoad)="load($event)"
        styleClass="rule-builder-table"
        aria-label="Rules"
      >
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
            <th pSortableColumn="workflowName">Workflow <p-sortIcon field="workflowName" /></th>
            <th>State</th>
            <th class="text-end">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rule>
          <tr>
            <td>
              <a [routerLink]="['/rules', rule.id]" class="fw-semibold">{{ rule.name }}</a>
            </td>
            <td>{{ rule.workflowName || '—' }}</td>
            <td>
              <p-tag
                [value]="rule.isActive ? 'Active' : 'Inactive'"
                [severity]="rule.isActive ? 'success' : 'secondary'"
              />
            </td>
            <td class="text-end">
              <a
                pButton
                [routerLink]="['/rules', rule.id]"
                severity="secondary"
                [text]="true"
                icon="pi pi-pencil"
                aria-label="Edit rule"
              ></a>
              <button
                pButton
                type="button"
                severity="danger"
                [text]="true"
                icon="pi pi-trash"
                aria-label="Delete rule"
                (click)="remove(rule)"
              ></button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="4" class="rule-builder-empty">No rules found.</td></tr>
        </ng-template>
      </p-table>
    </div>
  </section>
</main>
