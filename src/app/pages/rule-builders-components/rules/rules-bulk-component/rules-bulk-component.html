<div class="card flex justify-content-center align-items-center">
  <p-card header="Create Bulk Rules" class="azure-card" [style]="{ width: '55vw', margin: 'auto' }">
    @if (!selectedWorkflowId) {
    <p-message severity="warn" icon="pi pi-exclamation-circle" style="font-size: 15px"
      >Please Select one Workflow</p-message
    >

    }

<div class="card flex justify-content-center my-2">
      <p-select
        [options]="workflows()"
        [(ngModel)]="selectedWorkflowId"
        optionLabel="name"
        [optionValue]="'id'"
        display="chip"
        [filter]="true"
        (onFilter)="onWorkflowFilter($event)"
        placeholder="Select Workflows"
      />
    </div>

    <ng-template pTemplate="footer">
      <div class="d-flex w-100 justify-content-around mt-1 gap-4">
        <p-button
          label="Download Bulk Rules Sample"
          class="w-100 excel-button"
          icon="pi pi-download"
          styleClass="w-100"
          [disabled]="isLoading || !selectedWorkflowId"
          (click)="downloadBulkTemplate()"
        />
        <p-fileupload
          class="w-100"
          [disabled]="!selectedWorkflowId"
          mode="basic"
          name="myfile[]"
          chooseLabel="Upload Bulk Rules"
          chooseIcon="pi pi-upload"
          accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          maxFileSize="5000000"
          styleClass="w-full"
          [auto]="true"
          customUpload="true"
          (uploadHandler)="onUpload($event)"
        />
      </div>
    </ng-template>
  </p-card>
</div>
