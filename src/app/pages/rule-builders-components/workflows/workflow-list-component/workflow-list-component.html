<main class="rule-builder-page">
  <div class="filter-inputs">
    <app-form-page
      [dynamicControls]="dynamicControls"
      (formSubmit)="sumbitFilter($event)"
      (formResets)="resetFilter()"
    >
    </app-form-page>
  </div>
  <section class="rule-builder-card">
    <header class="rule-builder-card__header">
      <h1 class="rule-builder-card__title">Workflows</h1>
      <a pButton routerLink="/workflows/new" icon="pi pi-plus" label="Create workflow"></a>
    </header>

    <div class="rule-builder-card__body">
      <p-table
        #dt
        [value]="workflows()"
        [lazy]="true"
        [paginator]="true"
        [rows]="rows"
        [first]="first()"
        [totalRecords]="totalRecords()"
        [loading]="loading()"
        [rowHover]="true"
        [stripedRows]="true"
        (onLazyLoad)="load($event)"
        styleClass="rule-builder-table"
        aria-label="Workflows"
        [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[5,10, 25, 50,100]"
        currentPageReportTemplate="Total : {totalRecords}  "
      >
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
            <th pSortableColumn="ruleFormConfig.Name">
              Form config <p-sortIcon field="ruleFormConfig.Name" />
            </th>
            <th pSortableColumn="rejectionLevel">
              Rejection Level <p-sortIcon field="rejectionLevel" />
            </th>
            <th pSortableColumn="ruleCount">Rules <p-sortIcon field="ruleCount" /></th>
            <th pSortableColumn="isWorkflowLevel">
              Is Workflow Level <p-sortIcon field="isWorkflowLevel" />
            </th>
            <th class="text-end">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-workflow>
          <tr>
            <td>
              <a [routerLink]="['/workflows', workflow.id]" class="fw-semibold">
                {{ workflow.name }}
              </a>
            </td>
            <td>{{ workflow.ruleFormConfigName || 'None' }}</td>
            <td>{{ getEnumText(workflow.rejectionLevel) }}</td>
            <td>{{ workflow.ruleCount ?? 0 }}</td>
            <td>
              @if (workflow.isWorkflowLevel) {
              <i class="bi bi-check-circle-fill text-success"></i>
              } @else {
              <i class="bi bi-x-circle-fill text-danger"></i>
              }
            </td>
            <td class="text-end">
              <a
                pButton
                [routerLink]="['/workflows', workflow.id]"
                severity="secondary"
                [text]="true"
                icon="pi pi-pencil"
                aria-label="Edit workflow"
              ></a>
              <button
                pButton
                type="button"
                severity="danger"
                [text]="true"
                icon="pi pi-trash"
                aria-label="Delete workflow"
                (click)="remove(workflow)"
              ></button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="rule-builder-empty">No workflows found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </section>
</main>
