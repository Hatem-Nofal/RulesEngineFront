<div class="card" [style.borderTop]="color" style="border: none">
  <div class="card-top" [style.backgroundColor]="color"></div>
  <div class="card-header">
    <h3>{{ header }}</h3>
    <hr [style.borderColor]="color" [style.borderWidth]="'3px'" style="margin: 2px" />
  </div>
  <ul class="card-list" px-3 pb-3>
    <li *ngFor="let item of items" class="d-flex align-items-center mb-2">
      <i [class]="item.icon + ' me-2 text-' + (color ? 'primary' : '')"></i>
      <span class="title">{{ item.title }}:</span>
      <span
        class="value"
        [ngClass]="{
          'tag-yes': item.value === true || item.value === 'Yes',
          'tag-no': item.value === false || item.value === 'No',
        }"
      >
        {{
          item.value === true || item.value === 'Yes'
            ? 'Yes'
            : item.value === false || item.value === 'No'
              ? 'No'
              : item.value || '__'
        }}
      </span>
    </li>
  </ul>
</div>
