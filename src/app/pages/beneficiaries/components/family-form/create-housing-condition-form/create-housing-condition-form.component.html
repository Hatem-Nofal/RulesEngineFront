<div class="row mt-2" [formGroup]="formGroup">
  <!-- Total Rooms -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-input
      [isRequired]="formGroup.get('roomsCountTotal')?.hasValidator(Validators.required)"
      [label]="'RuleApplication::Families:TotalRooms' | abpLocalization"
      type="number"
      formControlName="roomsCountTotal"
      appMaxCharacters
      maxChar="2"
    >
    </app-custom-input>
    <app-forms-error [control]="formGroup.get('roomsCountTotal')"></app-forms-error>
  </div>

  <!-- Bedrooms (dependent on totalRooms) -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-input
      [isRequired]="formGroup.get('roomsCountForSleeping')?.hasValidator(Validators.required)"
      [label]="'RuleApplication::Families:Bedrooms' | abpLocalization"
      type="number"
      formControlName="roomsCountForSleeping"
      [isdisabled]="!formGroup.get('roomsCountTotal').value"
      appMaxCharacters
      maxChar="2"
    >
    </app-custom-input>
    <app-forms-error [control]="formGroup.get('roomsCountForSleeping')"></app-forms-error>
  </div>

  <!-- Ventilation -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-radio
      [label]="'RuleApplication::Families:Ventilation' | abpLocalization"
      [options]="ventilationOptions"
      formControlName="ventilationStatus"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('ventilationStatus')"></app-forms-error>
  </div>

  <!-- Water Source -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-radio
      [label]="'RuleApplication::Families:WaterSource' | abpLocalization"
      [options]="waterSourceOptions"
      formControlName="waterSourceType"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('waterSourceType')"></app-forms-error>
  </div>

  <!-- Sewage -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-radio
      [label]="'RuleApplication::Families:Sewage' | abpLocalization"
      [options]="sewageOptions"
      formControlName="sewage"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('sewage')"></app-forms-error>
  </div>

  <!-- Lighting Type -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-radio
      [label]="'RuleApplication::Families:LightingType' | abpLocalization"
      [options]="lightingOptions"
      formControlName="lightingType"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('lightingType')"></app-forms-error>
  </div>

  <!-- Animals/Birds -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-radio
      [label]="'RuleApplication::Families:AnimalsAtHome' | abpLocalization"
      [options]="animalsOptions"
      formControlName="hasBirdsOrAnimalsAtHome"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('hasBirdsOrAnimalsAtHome')"></app-forms-error>
  </div>

  <!-- Barn Existed -->
  <div class="col-lg-6 col-sm-12 mb-3">
    <app-custom-radio
      [label]="'RuleApplication::Families:BarnExisted' | abpLocalization"
      [options]="barnOptions"
      formControlName="hasBarn"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('hasBarn')"></app-forms-error>
  </div>

  <!-- Barn Location (dependent on barnExisted) -->
  <div class="col-lg-6 col-sm-12 mb-3" *ngIf="formGroup.get('hasBarn')?.value === true">
    <app-custom-radio
      [label]="'RuleApplication::Families:BarnLocation' | abpLocalization"
      [options]="barnLocationOptions"
      formControlName="barnLocationType"
    >
    </app-custom-radio>
    <app-forms-error [control]="formGroup.get('barnLocationType')"></app-forms-error>
  </div>

  <!-- Notes -->
  <div class="col-lg-12 col-sm-12 mb-3">
    <app-custom-textarea
      [label]="'RuleApplication::Families:HousingNotes' | abpLocalization"
      formControlName="notes"
      [maxLength]="1000000"

    >
    </app-custom-textarea>
    <app-forms-error [control]="formGroup.get('notes')"></app-forms-error>
  </div>
</div>
