<div class="card pt-0">
  <div class="card-header ">
    <div class="d-flex align-items-center justify-content-between flex-wrap">
      <h3 class="p-0 mb-0">
        <i class="bi bi-box me-1"></i>
        Coding Batches
      </h3>
      <div class="header-filter d-flex align-items-center flex-column gap-2">
        <div class="d-flex align-items-center gap-2">
          <div class="header-filter">
            <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample"
              aria-expanded="true" aria-controls="collapseExample">
              <i class="bi bi-funnel me-1"></i>
              Filter
            </button>
          </div>
          <div *ngIf="showCreateButton">
            <a routerLink="/coding-batches/create">
              <button class="btn btn-primary fs-20">
                <i class="bi bi-plus-lg pe-1 m-0"></i>
                Add New
              </button>
            </a>
          </div>
        </div>
       
        <div class="generate_button w-100" *ngIf="this.statusName === 'all' && this.bacthExcelPermission ">
          <button class="btn fs-20 w-100" style="background-color: #047857;" (click)="getExcel()">
            Generate Batches Report
          </button>
        </div>
      </div>
    </div>
  
    <div class="collapse show" id="collapseExample">
      <div class="card card-body pb-0 pt-1 px-4 mb-0" style="background-color: rgba(245, 245, 245, 0.653)">
        <app-form-page [dynamicControls]="dynamicControls" (formSubmit)="handleFormSubmit($event)"></app-form-page>
      </div>
    </div>
 

  <div class="card-body p-0 pt-2">
    <app-shared-table (openAssignToDialog)="openAssignTo($event)" (getPaginatedData)="getPaginatedData($event)"
      [columns]="columns" [data]="batchesData" [config]="tableConfig" [paginationInfo]="paginationInfo"
      [actions]="actions"  [_externalFilter]="_externalFilter">
    </app-shared-table>
  </div>
</div>

<p-dialog header="Assign Batch to" [modal]="true" [draggable]="false" [(visible)]="openAssignToDailog"
  [style]="{ width: '25rem' }">
  <app-custom-radio [(ngModel)]="assignToValue"  [options]="assignesoptions"></app-custom-radio>
  <div style="text-align: end;">

    <button class="btn btn-primary" style="padding: 12px 35px !important;" (click)="submitAssignee()">
      Save
    </button>
  </div>
</p-dialog>
