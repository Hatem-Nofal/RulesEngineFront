<section class="cliams-edit">
  <div class="clim-batch info">
    <div class="card">
      <div class="card-header p-0 m-0">
        <h4 class="p-0 m-0">
          <i class="bi bi-chevron-double-right" style="font-size: 13px;"></i>
          Edit Batch
        </h4>
      </div>
    </div>
  </div>
  <div class="claim-info px-4">
    <form [formGroup]="healthcareForm" (ngSubmit)="onSubmit()" class="row">
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="ehealth_Batch_code" label="Ehealth Code" type="text"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('ehealth_Batch_code')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="providerCode"[isdisabled]="true" label="Provider Code" type="text"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('providerCode')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="uhia_Batch_code" label="UHIA ID" type="text"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('uhia_Batch_code')"></app-forms-error>
      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="providerType" [isdisabled]="true" label="Provider Type" type="text"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('providerType')"></app-forms-error>
      </div>
      <!-- <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="lhaSerial" label="LHA Serial" type="text"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('lhaSerial')"></app-forms-error>

      </div> -->
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-dropdown
        formControlName="provider_id"
        label="Provider Name"
        [options]="providerList"
      ></app-custom-dropdown>
        <app-forms-error [control]="healthcareForm.get('provider_id')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-dropdown
        formControlName="type_id"
        label="Type"
        [options]="typeList"
      ></app-custom-dropdown>
        <!-- <app-custom-input formControlName="type_id" label="Type" type="text"></app-custom-input> -->
        <app-forms-error [control]="healthcareForm.get('type_id')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-dropdown
        formControlName="status_id"
        label="Status"
        [options]="statusList"
      ></app-custom-dropdown>
        <!-- <app-custom-input formControlName="status_id" label="Status" type="text"></app-custom-input> -->
        <app-forms-error [control]="healthcareForm.get('status_id')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="reception_Date" label="Reception Date"
          type="datetime-local"></app-custom-input>
          <app-forms-error [control]="healthcareForm.get('reception_Date')"></app-forms-error>

        </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="service_Date" label="Service Date" type="datetime-local"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('service_Date')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="claims_Count" [format]="'0.000'" label="UHIA Cliams Count"  type="number"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('claims_Count')"></app-forms-error>

      </div>
      <div class="col-lg-6 col-sm-12 mb-2">
        <app-custom-input formControlName="claims_Amount" label="Claimed Net" type="number"></app-custom-input>
        <app-forms-error [control]="healthcareForm.get('claims_Amount')"></app-forms-error>

      </div>
      <div class="col-12" style="text-align: end;">
        <button type="submit" class="btn btn-primary mt-3 update_btn">Update</button>
      </div>
    </form>
  </div>
</section>
