<div class="radio-group row">
  @if (label) {
    <label class="form-label fs-14 pb-1">{{ label }}<span *ngIf="isRequired" class="text-danger">*</span> </label>
  }
  @for (option of options; track $index) {
    <div
      class="radio-item form-check mb-1"
      [ngClass]="option.name?.length >= 25 ? 'col-12' : 'col-6'"
    >
      <input
        class="form-check-input"
        type="radio"
        [id]="name + '-' + option.id"
        [name]="name"
        [value]="option.id"
        [checked]="value == option.id"
        [disabled]="option.disabled"
        (change)="updateValue(option.id)"
      />
      <label class="fs-14 form-check-label" [for]="name + '-' + option.id">{{ option.name }}</label>
    </div>
  }
</div>
