<div class="form-group">
  @if(label){
  <label>{{ label }}</label>
  }
  <div class="row">
    @for (option of options; track $index) {

    <div [class]="size">
      <div class="custom-checkbox form-check mt-1">
        <input type="checkbox" class="form-check-input" [checked]="selectedValue?.includes(option.id)"
          [disabled]="!option.disabled" (change)="toggleValue(option)" />
        <label class="form-check-label fs-14" [for]="option.id">{{ option.name }}</label>
      </div>
    </div>
    }
  </div>
</div>
