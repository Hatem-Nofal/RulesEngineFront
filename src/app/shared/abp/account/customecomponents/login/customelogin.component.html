<div class="login-page container ">
  <div class="row h-screen">
    <!-- Image Section - Left Half -->
    <div class="col-md-6 col-sm-12 bg-login p-0 m-0">
      <div class=" d-flex flex-column align-items-center justify-content-between h-100">
        <!-- <p class="head text-3xl font-bold mb-4">{{ "::LongWelcomeMessage" | abpLocalization }}</p> -->
        <div class="copyright w-full text-center bg-red">
          <!-- <p class="m-0">{{ "::copyRight" | abpLocalization }} <span>{{year}}</span></p> -->
        </div>
      </div>
    </div>

    <!-- Login Section - Right Half -->
    <div class="col-md-6 col-sm-12  p-0 m-0">
      <div class="card login-Card d-flex align-items-center justify-content-center max-w-md h-100 w-100 rounded-0">
        <div class="card-body rounded-4">
          <div class="d-flex px-4  justify-content-between align-items-center">
            <img src="./assets/images/logo/ehealth-logo-blue.png" class="img-responsive" width="40%"
              alt="" />
            <!-- @if(!ltr) {<p class="cursor-pointer lang m-0" (click)="localizationChange('en')">English</p>}
            @else {<p class="cursor-pointer lang m-0" (click)="localizationChange('ar')">العربية</p>} -->

          </div>
          <div class="auth-content mt-3">
            <p class="flex items-center">
              <!-- <i class="feather icon-chevron-left me-3"></i> -->
              <span class="text-head">
                {{ "::Login" | abpLocalization }}
              </span>
            </p>
            <!-- <p class="text-desc ms-4">
              {{
              "This is a secure site, Please enter your Information to Login" | abpLocalization
              }}
            </p> -->
          </div>

          <form [formGroup]="form" (ngSubmit)="onSubmit()" validateOnSubmit class="mt-2">
            <div class="mb-2 form-group">
              <label for="login-input-user-name-or-email-address" class="form-label">{{
                'AbpAccount::UserNameOrEmailAddress' | abpLocalization
                }}</label>
              <input class="form-control" type="text" id="login-input-user-name-or-email-address"
                formControlName="username" autocomplete="username" autofocus />
            </div>
            <div class="mb-2 form-group">
              <label for="login-input-password" class="form-label">{{
                'AbpAccount::Password' | abpLocalization
                }}</label>
              <input class="form-control" type="password" id="login-input-password" formControlName="password"
                autocomplete="current-password" />
            </div>

            <div class="row">
              <div class="col">
                <div class="form-check">
                  <label class="form-check-label mb-2" for="login-input-remember-me">
                    <input class="form-check-input" type="checkbox" id="login-input-remember-me"
                      formControlName="rememberMe" />
                    {{ 'AbpAccount::RememberMe' | abpLocalization }}
                  </label>
                </div>
              </div>
              <!-- <div class="text-end col">
                <a routerLink="/account/forgot-password">{{
                  'AbpAccount::ForgotPassword' | abpLocalization
                  }}</a>
              </div> -->
            </div>

            <abp-button [loading]="inProgress" buttonType="submit" name="Action"
              buttonClass="btn-block btn-lg mt-3 btn btn-primary w-100">
              {{ 'AbpAccount::Login' | abpLocalization }}
            </abp-button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
